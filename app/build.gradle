plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// VIP anti-tamper HMAC secret — đọc từ local.properties (gitignored, mirror pattern jitpackToken ở
// settings.gradle) hoặc biến môi trường VIP_KEY_SECRET (CI), KHÔNG hardcode secret production trong
// file tracked (audit vòng 4, codex — secret literal trong Git history dễ lộ qua repo/fork/log).
// Fallback dùng ĐÚNG default weak-secret của chính SDK ("TPLdev0402dev@") thay vì tự bịa placeholder —
// máy chưa cấu hình vip.key.secret sẽ kích đúng crash-guard SẴN CÓ của SDK ở setConfig() khi build
// release (fail-fast rõ ràng), thay vì âm thầm build ra secret yếu tưởng-như-hợp-lệ mà pass qua.
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def vipKeySecretValue = localProps.getProperty("vip.key.secret") ?: System.getenv("VIP_KEY_SECRET") ?: "TPLdev0402dev@"
def umpDebugGeographyValue = localProps.getProperty("ump.debug.geography") ?: ""
def umpTestDeviceHashValue = localProps.getProperty("ump.test.device.hash") ?: ""
def signingProps = new Properties()
def signingPropsFile = rootProject.file("keystore.properties")
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def releaseStoreFileValue = signingProps.getProperty("storeFile") ?: localProps.getProperty("release.store.file") ?: System.getenv("RELEASE_STORE_FILE")
def releaseStorePasswordValue = signingProps.getProperty("storePassword") ?: localProps.getProperty("release.store.password") ?: System.getenv("RELEASE_STORE_PASSWORD")
def releaseKeyAliasValue = signingProps.getProperty("keyAlias") ?: localProps.getProperty("release.key.alias") ?: System.getenv("RELEASE_KEY_ALIAS")
def releaseKeyPasswordValue = signingProps.getProperty("keyPassword") ?: localProps.getProperty("release.key.password") ?: System.getenv("RELEASE_KEY_PASSWORD")

android {
    namespace 'com.galaxyjoy.hexviewer'
    compileSdk 36
    defaultConfig {
        //fr.ralala.hexviewer
        applicationId "com.galaxyjoy.hexviewer"
        minSdk 24
        //noinspection EditedTargetSdkVersion
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode 20260817
        versionName '2026.08.17'
        vectorDrawables {
            useSupportLibrary true
        }

        // Optimize APK size with splits
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        // AppLovin SDK Key
        buildConfigField "String", "APPLOVIN_SDK_KEY", "\"e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt\""

        // AppLovin Ad IDs (same for debug & release)
        buildConfigField "String", "APPLOVIN_BANNER_ID",       "\"aa53ac5866596140\""
        buildConfigField "String", "APPLOVIN_INTERSTITIAL_ID", "\"580476ed6f6e6d5b\""
        buildConfigField "String", "APPLOVIN_APP_OPEN_ID",     "\"2d9943cb1d30a275\""
        buildConfigField "String", "APPLOVIN_REWARDED_ID",     "\"18d3030a0f4eec4b\""
        buildConfigField "String", "PRIVACY_POLICY_URL",       "\"https://loitp.notion.site/Term-Privacy-Policy-Disclaimer-319b1cd8783942fa8923d2a3c9bce60f\""

        // VIP anti-tamper HMAC secret (AdSdkConfig.vipKeySecret) — random ≥16 ký tự, KHÔNG PHẢI VIP
        // redeem key (audit F2/F13/F22). Giá trị thật đọc từ local.properties `vip.key.secret=`
        // (xem đầu file) — KHÔNG hardcode ở đây (audit vòng 4).
        buildConfigField "String", "VIP_KEY_SECRET",        "\"${vipKeySecretValue}\""
        // VIP token verify public key (ECDSA P-256, X.509 DER base64) — AdSdkConfig.vipTokenPublicKey.
        // An toàn để ship (chỉ verify, không ký). Private key giữ ở local.properties (gitignored),
        // KHÔNG bao giờ đưa vào app/BuildConfig. Sinh bằng openssl (xem local.properties).
        buildConfigField "String", "VIP_TOKEN_PUBLIC_KEY",  "\"MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEuXgrCLajrg+xTE1SEXCnWd77zPjOD6nd9MbKdpw1EiL5V+dWLCKfGLTM+ZxXU05//+mHfeifqNoQVH69/Bzntw==\""

        // GAID của máy dev/QA để khai AdManager.setTestDeviceIds() — BẮT BUỘC trước khi test ad thật
        // (Bước 3b, AD_PROMPT_AOS.MD) để tránh invalid-traffic khoá tài khoản. Rỗng = chưa khai, điền
        // GAID thật khi có (adb hoặc AdManager.getCurrentDeviceGAID()).
        buildConfigField "String", "TEST_DEVICE_GAID_1", "\"\""
        buildConfigField "String", "TEST_DEVICE_GAID_2", "\"\""

        // Symbols exist for every variant; only debug overrides them with local QC values below.
        buildConfigField "String", "UMP_DEBUG_GEOGRAPHY", "\"\""
        buildConfigField "String", "UMP_TEST_DEVICE_HASH", "\"\""
    }

    // Enable ABI and Density splits for smaller APK sizes
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.15'
    }
    signingConfigs {
        release {
            // Credentials come only from keystore.properties/local.properties (both gitignored)
            // or CI environment.
            // No repository-relative or developer-specific fallback is allowed.
            if (releaseStoreFileValue) storeFile file(releaseStoreFileValue)
            storePassword releaseStorePasswordValue
            keyAlias releaseKeyAliasValue
            keyPassword releaseKeyPasswordValue
        }
    }
    buildTypes {
        release {
            // Never package forced-EEA/test-device identifiers in a release artifact.
            buildConfigField "String", "UMP_DEBUG_GEOGRAPHY", "\"\""
            buildConfigField "String", "UMP_TEST_DEVICE_HASH", "\"\""
            // AdMob ID production thật — user cung cấp 2026-08-16 (doc/ad/ad.md), publisher
            // ca-app-pub-3004713799155145. App ID tương ứng đã cập nhật ở AndroidManifest.xml.
            buildConfigField "String", "ADMOB_BANNER_ID",       "\"ca-app-pub-3004713799155145/1141740550\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3004713799155145/7197485190\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID",     "\"ca-app-pub-3004713799155145/6673957197\""
            buildConfigField "String", "ADMOB_REWARDED_ID",     "\"ca-app-pub-3004713799155145/4854392881\""
            // Native ad ID user cung cấp (ca-app-pub-3004713799155145/6809688569) KHÔNG đưa vào
            // BuildConfig — SDK AdmobApplovinWrapper tag 1.6.16 không có API native ad (không
            // admobNativeId/loadNative/showNative), giữ field chết là dead code (audit vòng 3, YAGNI).
            // Giá trị đã lưu ở doc/ad/ad.md — thêm lại khi SDK/app thật sự hỗ trợ native ad.
            buildConfigField("Boolean", "IS_ENABLE_ADMOB", "true") // true = AdMob (ưu tiên theo yêu cầu user)

            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
            // Use custom optimize file (more aggressive) or SDK default
            proguardFiles 'proguard-android-optimize.txt', 'proguard-rules.pro'
            // Alternative: Use SDK default if custom file has issues
            // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Additional optimizations for smaller APK
            ndk {
                debugSymbolLevel 'NONE'
            }
        }
        debug {
            // QC-only: force UMP geography/test device without VPN. Values live in ignored
            // local.properties and are never inherited by release variants.
            buildConfigField "String", "UMP_DEBUG_GEOGRAPHY", "\"${umpDebugGeographyValue}\""
            buildConfigField "String", "UMP_TEST_DEVICE_HASH", "\"${umpTestDeviceHashValue}\""
            buildConfigField "String", "ADMOB_BANNER_ID",       "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID",     "\"ca-app-pub-3940256099942544/9257395921\""
            buildConfigField "String", "ADMOB_REWARDED_ID",     "\"ca-app-pub-3940256099942544/5224354917\""
            buildConfigField("Boolean", "IS_ENABLE_ADMOB", "true") // true = AdMob (ưu tiên theo yêu cầu user)

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules-debug.pro'
        }
    }
    buildFeatures {
        compose false
        buildConfig true
        viewBinding true
    }
    lint {
        abortOnError true
    }
    flavorDimensions.add("type")
    productFlavors {
        dev {
            buildConfigField "Boolean", "build_debug", "true"
            dimension "type"
            buildConfigField("String", "FLAVOR_buildEnv", '"dev"')

//            resValue("string", "SDK_KEY", "e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt")
//            resValue("string", "BANNER", "aa53ac5866596140")
//            resValue("string", "INTER", "580476ed6f6e6d5b")
//            resValue("string", "EnableAdInter", "true")
//            resValue("string", "EnableAdBanner", "true")
        }
        production {
            buildConfigField "Boolean", "build_debug", "false"
            dimension "type"
            buildConfigField("String", "FLAVOR_buildEnv", '"prod"')

//            resValue("string", "SDK_KEY", "e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt")
//            resValue("string", "BANNER", "aa53ac5866596140")
//            resValue("string", "INTER", "580476ed6f6e6d5b")
//            resValue("string", "EnableAdInter", "true")
//            resValue("string", "EnableAdBanner", "true")
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            // Cô lập mỗi test CLASS bằng 1 JVM riêng (fork mới) — AdmobApplovinWrapper SDK có static
            // singleton chống brute-force (vipActivationBackoff trong AdManager, cố ý sống hết đời
            // process/JVM, không có API public reset) nên 1 test dùng key sai ở class này có thể làm
            // cooldown rò sang test dùng key đúng ở class khác chạy sau trong CÙNG JVM (audit vòng 3,
            // finding C1 — full suite fail không ổn định tuỳ thứ tự class dù mỗi class riêng lẻ pass).
            all {
                it.forkEvery = 1
            }
        }
    }
}

// Fail release signing with an actionable message instead of an opaque AGP null/path error.
tasks.configureEach { task ->
    if (task.name == "validateSigningProductionRelease") {
        task.doFirst {
            def missing = []
            if (!releaseStoreFileValue) missing << "storeFile / RELEASE_STORE_FILE"
            if (!releaseStorePasswordValue) missing << "storePassword / RELEASE_STORE_PASSWORD"
            if (!releaseKeyAliasValue) missing << "keyAlias / RELEASE_KEY_ALIAS"
            if (!releaseKeyPasswordValue) missing << "keyPassword / RELEASE_KEY_PASSWORD"
            if (!missing.isEmpty()) {
                throw new GradleException("Missing release signing values: ${missing.join(', ')}. Configure ignored keystore.properties/local.properties or CI secrets.")
            }
            if (!file(releaseStoreFileValue).isFile()) {
                throw new GradleException("Release keystore does not exist: ${releaseStoreFileValue}")
            }
        }
    }
}


dependencies {
    // Kotlin - stdlib auto-included by Kotlin plugin, explicit declaration removed
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Removed Apache Commons dependency (~600KB saved)
    // Replaced CircularFifoQueue with lightweight CircularLogBuffer utility class
    // implementation 'org.apache.commons:commons-collections4:4.5.0'

    // AndroidX Core
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.emoji:emoji:1.1.0"
    implementation "androidx.emoji:emoji-bundled:1.1.0"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "com.google.android.material:material:1.13.0" // Upgraded for Material 3
    implementation 'androidx.core:core-ktx:1.15.0' // Keep: 1.17.0 requires AGP 8.9.1+

    // Security - Encrypted SharedPreferences for sensitive data
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Debug tools
//    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    // Lottie animations (preserved)
    implementation "com.airbnb.android:lottie:6.5.2"

    // UI/UX Enhancements
    implementation 'com.facebook.shimmer:shimmer:0.5.0' // Skeleton loading screens

    // Play Services
    implementation("com.google.android.play:review:2.0.2")
    implementation("com.google.android.play:review-ktx:2.0.2")

    // Ad SDK — AdmobApplovinWrapper bundles AdMob + AppLovin MAX (1 dòng thay 2 dòng cũ)
    implementation("com.github.royt93:AdmobApplovinWrapper:1.6.16")
    implementation("nl.dionsegijn:konfetti-xml:2.0.5")

    // Removed dependencies (saved ~0.1 MB):
    // - org.jetbrains.kotlin:kotlin-stdlib:2.1.0 (auto-included by Kotlin plugin - saved ~0.1 MB)

    // Kept commons-collections4:
    // - CircularFifoQueue provides thread-safe circular buffer with auto-eviction
    // - ArrayDeque replacement had race condition bugs in multi-threaded logging
    // - Size cost: ~500 KB, but necessary for correct logging behavior

    // Unit Testing - Updated to latest versions
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'com.google.truth:truth:1.4.5'

    // Instrumented Testing - Updated to latest versions
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'org.mockito:mockito-android:5.20.0'
}
